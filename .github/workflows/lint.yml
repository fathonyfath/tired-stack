name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Node.js download
        uses: actions/cache@v6
        with:
          path: |
            .gradle/nodejs
            app/.gradle/nodejs
          key: node-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            app/build/tired/web-assets/node_modules
            plugin/src/main/resources/dev/fathony/tired/toolchain/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml', 'plugin/src/main/resources/dev/fathony/tired/toolchain/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: check
        run: ./gradlew check
