name: Clean Up Docker Images

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    name: Prune GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: tired-stack-sample
          delete-untagged: true
          keep-n-tagged: 10
          exclude-tags: latest
